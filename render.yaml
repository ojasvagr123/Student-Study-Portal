databases:
  - name: studify-db
    plan: free
    databaseName: studify
    user: studify

services:
  - type: web
    name: studify-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        fromDatabase: { name: studify-db, property: host }
      - key: PGPORT
        fromDatabase: { name: studify-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: studify-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: studify-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: studify-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: studify-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
